<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Side Notes</title>
  <style>
    :root {
      --bg: #ffffff;
      --sidebar-bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --hover: #f1f5f9;
      --active: #e2e8f0;
      --code-bg: #f1f5f9;
      --code-text: #0f172a;
      --pre-bg: #0f172a;
      --pre-text: #f8fafc;
      --tree-width: 170px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --sidebar-bg: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --hover: #334155;
        --active: #475569;
        --code-bg: #1e293b;
        --code-text: #f1f5f9;
        --pre-bg: #020617;
        --pre-text: #f8fafc;
      }

      textarea#editor {
        color: #f8fafc !important;
        background: transparent !important;
      }

      select#note-select,
      .icon-btn-sm,
      button.icon-btn {
        background: #1e293b !important;
        color: #f8fafc !important;
        border-color: #334155 !important;
      }

      .icon-btn-sm:hover,
      button.icon-btn:hover {
        background: #334155 !important;
      }

      .folder-header {
        color: #e2e8f0 !important;
      }

      .segmented-control {
        background: #334155 !important;
      }

      .segmented-control button.active {
        background: #0f172a !important;
        color: #f8fafc !important;
      }

      #editor-pane header {
        background: #0f172a !important;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Collapsible Left File Tree */
    #tree-pane {
      width: var(--tree-width);
      min-width: var(--tree-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: margin-left 0.22s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    /* When collapsed, slide off-screen to the left */
    #tree-pane.collapsed {
      margin-left: calc(-1 * var(--tree-width));
      opacity: 0;
      pointer-events: none;
    }

    /* Folder chevron and collapse state */
    .folder-header .chevron {
    display: inline-block;
    font-size: 9px;
    transition: transform 0.15s ease;
    margin-right: 4px;
    }

    .folder-group.collapsed .chevron {
    transform: rotate(-90deg);
    }

    .folder-group.collapsed .note-list {
    display: none;
    }

    .pane-header {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 41px;
    }

    .pane-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    .icon-btn-sm {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      height: 22px;
    }
    .icon-btn-sm:hover { background: var(--hover); }

    #tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .folder-group { margin-bottom: 6px; }

    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
    }
    .folder-header:hover { background: var(--hover); }

    .folder-name {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-actions {
      display: none;
      gap: 2px;
    }
    .folder-header:hover .folder-actions { display: flex; }

    .note-list {
      padding-left: 14px;
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .note-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note-item:hover { background: var(--hover); color: var(--text); }
    .note-item.active { background: var(--active); color: var(--text); font-weight: 500; }

    /* Right Editor Main Pane */
    #editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      min-width: 0; /* Prevents flex children from blowing past container width */
    }

    header {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      min-height: 41px;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .segmented-control {
      display: flex;
      background: var(--border);
      border-radius: 6px;
      padding: 2px;
    }
    .segmented-control button {
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      color: var(--muted);
      cursor: pointer;
    }
    .segmented-control button.active { background: #fff; color: var(--text); }

    .editor-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      overflow: hidden;
    }

    textarea#editor {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      background: transparent;
      color: var(--text);
    }

    #preview {
      display: none;
      width: 100%;
      height: 100%;
      padding: 12px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    #preview h1, #preview h2, #preview h3 { margin: 10px 0 6px; font-weight: 600; }
    #preview h1 { font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    #preview p { margin-bottom: 8px; }
    #preview ul, #preview ol { padding-left: 18px; margin-bottom: 8px; }
    #preview code { background: var(--code-bg); color: var(--code-text); padding: 2px 4px; border-radius: 4px; font-size: 11px; }
    #preview pre { background: var(--pre-bg); color: var(--pre-text); padding: 8px; border-radius: 4px; overflow-x: auto; margin-bottom: 8px; }
    #preview pre code { background: transparent; color: inherit; }
    #preview blockquote { border-left: 3px solid var(--primary); padding-left: 8px; color: var(--muted); margin: 8px 0; }
    #preview a { color: var(--primary); text-decoration: none; }
    #preview a:hover { text-decoration: underline; }

    footer {
      padding: 4px 12px;
      border-top: 1px solid var(--border);
      background: var(--sidebar-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      min-height: 24px;
    }

    /* Custom In-DOM Modal Overlay */
    #confirm-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      backdrop-filter: blur(2px);
    }

    #confirm-modal-overlay.open {
      display: flex;
    }

    .custom-modal {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 85%;
      max-width: 270px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .modal-msg {
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
      word-break: break-word;
    }

    .modal-input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }

    .modal-input:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .modal-btn {
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: background 0.15s ease;
    }

    .modal-btn.cancel {
      background: transparent;
      color: var(--muted);
    }
    .modal-btn.cancel:hover {
      background: var(--hover);
      color: var(--text);
    }

    .modal-btn.confirm {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .modal-btn.confirm:hover {
      background: var(--primary-hover);
    }

    .modal-btn.danger {
      background: var(--danger, #ef4444);
      color: #ffffff;
      border-color: var(--danger, #ef4444);
    }
    .modal-btn.danger:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <!-- File Tree Sidebar -->
  <div id="tree-pane">
    <div class="pane-header">
      <span class="pane-title">Folders</span>
      <div style="display: flex; gap: 4px;">
        <button id="add-folder-btn" class="icon-btn-sm" title="New Folder">📁+</button>
      </div>
    </div>
    <div id="tree-container"></div>
  </div>

  <!-- Note Editor Pane -->
  <div id="editor-pane">
    <header>
      <div class="header-left">
        <!-- Sidebar Collapse / Expand Toggle Button -->
        <button id="toggle-tree-btn" class="icon-btn-sm" title="Toggle Focus Mode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <div class="segmented-control">
          <button id="tab-edit" class="active">Write</button>
          <button id="tab-preview">Preview</button>
        </div>
      </div>
      <div class="header-right">
        <button id="clip-btn" class="icon-btn-sm" title="Clip highlighted text & URL">✂ Clip</button>
        <button id="delete-btn" class="icon-btn-sm" title="Delete Note">🗑</button>
      </div>
    </header>

    <div class="editor-wrapper">
      <textarea id="editor" placeholder="Write markdown or use Clip..."></textarea>
      <div id="preview"></div>
    </div>

    <footer>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span id="stats">0 words</span>
      <span id="git-indicator" style="display: none; align-items: center; gap: 4px; color: var(--muted); cursor: pointer;" title="Configured with GitHub">
        <!-- Git Branch Icon -->
        <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
          <path fill-rule="evenodd" d="M11.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122V6A2.5 2.5 0 0110 8.5H6a1 1 0 00-1 1v1.128a2.251 2.251 0 11-1.5 0V5.372a2.25 2.25 0 111.5 0v1.836A2.492 2.492 0 016 7h4a1 1 0 001-1v-.628A2.25 2.25 0 019.5 3.25zM4.25 12a.75.75 0 100 1.5.75.75 0 000-1.5zM3.5 3.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0z"></path>
        </svg>
        <span id="git-status-text">main</span>
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <span id="save-status">Saved</span>
      <button id="git-config-btn" class="icon-btn-sm" title="Configure Git Sync" style="height: 18px; padding: 1px 4px; font-size: 10px;">⚙ Git</button>
    </div>
  </footer>
  </div>

  <!-- In-DOM Custom Modal -->
  <div id="confirm-modal-overlay">
    <div class="custom-modal">
      <div id="modal-title" class="modal-title">Prompt</div>
      <div id="modal-message" class="modal-msg"></div>
      <input type="text" id="modal-input" class="modal-input" style="display: none;" autocomplete="off" />
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="modal-btn cancel">Cancel</button>
        <button id="modal-confirm-btn" class="modal-btn confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
